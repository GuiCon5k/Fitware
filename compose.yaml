services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fitware
      POSTGRES_USER: fitware
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env antes de iniciar Docker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitware_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitware -d fitware"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fitware_postgres:
